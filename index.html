<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Rejoins mon foyer sur WhoDid</title>
  <meta name="description" content="Tu as reçu une invitation pour rejoindre un foyer sur WhoDid, l'app qui transforme les tâches ménagères en jeu.">
  <meta property="og:title" content="Rejoins mon foyer sur WhoDid 🏠">
  <meta property="og:description" content="Ouvre l'invitation pour rejoindre le foyer en un geste.">
  <meta property="og:type" content="website">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#F5F0E8">
  <!--
    Page d'invitation WhoDid — GitHub Pages, dépôt public "join".
    URL : https://antoncanada89-code.github.io/join/?c=ABC123

    Aucun traceur, aucun script externe : le code d'invitation donne accès
    à un foyer, il ne doit partir nulle part ailleurs.

    À RENSEIGNER : APP_STORE_ID (App Store Connect → Informations sur
    l'app → « Identifiant Apple », un nombre). Tant qu'il est vide, le
    bouton iPhone ouvre une recherche « WhoDid » dans l'App Store.
  -->
  <style>
    :root {
      --bg: #F5F0E8; --card: #FFFFFF; --text: #2B2118; --muted: #7A6A58;
      --primary: #8B6914; --secondary: #5C3D2E; --border: #E6DCCB; --on-primary: #FFFFFF;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #17120D; --card: #221B14; --text: #F3EADC; --muted: #A8977F;
        --primary: #C9A24A; --secondary: #E2C9A6; --border: #3A2F23; --on-primary: #17120D;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex; align-items: center; justify-content: center;
      padding: 24px 16px calc(24px + env(safe-area-inset-bottom));
    }
    main { width: 100%; max-width: 420px; text-align: center; }
    .logo { font-size: 28px; font-weight: 800; color: var(--secondary); letter-spacing: -0.5px; }
    .logo span { color: var(--primary); }
    h1 { font-size: 22px; line-height: 1.3; margin: 18px 0 8px; }
    p { color: var(--muted); line-height: 1.5; margin: 0 0 16px; font-size: 15px; }
    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: 20px;
      padding: 22px 18px; margin: 20px 0;
    }
    .label { font-size: 11px; font-weight: 700; letter-spacing: 1.5px; color: var(--primary); text-transform: uppercase; }
    .code { font-size: 36px; font-weight: 800; letter-spacing: 8px; color: var(--primary); margin: 6px 0 10px; font-variant-numeric: tabular-nums; }
    .btn {
      display: block; width: 100%; padding: 15px 18px; border-radius: 14px; border: 0;
      font-family: inherit; font-size: 16px; font-weight: 700; text-decoration: none; cursor: pointer; margin-top: 10px;
    }
    .btn-primary { background: var(--primary); color: var(--on-primary); }
    .btn-ghost { background: transparent; color: var(--primary); border: 1.5px solid var(--primary); }
    .small { font-size: 13px; color: var(--muted); margin-top: 14px; }
    .step { text-align: left; font-size: 14px; color: var(--muted); margin: 14px 0 0; }
    .step b { color: var(--text); }
    .hidden { display: none; }
    .error { color: #B3261E; }
  </style>
</head>
<body>
<main>
  <div class="logo">Who<span>Did</span></div>

  <div id="invite" class="hidden">
    <h1 id="title"></h1>
    <p id="subtitle"></p>

    <div class="card">
      <div class="label" id="codeLabel"></div>
      <div class="code" id="code"></div>
      <button class="btn btn-ghost" id="copyBtn" type="button"></button>
    </div>

    <!-- Android : un seul bouton. Ouvre l'app si elle est installée, sinon
         Google Play — et le code traverse l'installation. -->
    <div id="android" class="hidden">
      <a class="btn btn-primary" id="androidBtn"></a>
      <p class="small" id="androidHint"></p>
    </div>

    <!-- iPhone : ouvrir l'app, ou l'installer puis revenir ici. -->
    <div id="ios" class="hidden">
      <a class="btn btn-primary" id="iosOpenBtn"></a>
      <a class="btn btn-ghost" id="iosStoreBtn"></a>
      <p class="step" id="iosStep"></p>
    </div>

    <!-- Ordinateur : les deux stores. -->
    <div id="desktop" class="hidden">
      <a class="btn btn-primary" id="deskIos"></a>
      <a class="btn btn-ghost" id="deskAndroid"></a>
      <p class="small" id="deskHint"></p>
    </div>
  </div>

  <div id="invalid" class="hidden">
    <h1 id="invalidTitle"></h1>
    <p id="invalidText"></p>
  </div>
</main>

<script>
(function () {
  var APP_STORE_ID = "6774188080"; // ex. "6740000000" — voir le commentaire en haut
  var PACKAGE = "fr.whodid.app";

  var params = new URLSearchParams(location.search);
  var code = (params.get("c") || params.get("code") || "").trim().toUpperCase();
  var valid = /^[A-Z0-9]{6}$/.test(code);

  var fr = (navigator.language || "fr").toLowerCase().indexOf("fr") === 0;
  var t = fr ? {
    title: "Tu es invité·e dans un foyer WhoDid 🏠",
    subtitle: "Partagez les tâches de la maison, gagnez des points, et voyez enfin qui fait quoi.",
    codeLabel: "Code d'invitation",
    copy: "Copier le code", copied: "Code copié ✓",
    androidBtn: "Rejoindre le foyer",
    androidHint: "Si WhoDid n'est pas encore installée, Google Play s'ouvre : le code sera déjà rempli après l'inscription.",
    iosOpen: "J'ai WhoDid — rejoindre le foyer",
    iosStore: "Je n'ai pas encore WhoDid",
    iosStep: "<b>Après l'installation</b>, reviens sur cette page et touche « J'ai WhoDid » : le code sera rempli pour toi. Sinon, dans l'app : <b>Rejoindre un foyer</b> → colle le code.",
    deskIos: "Télécharger sur l'App Store",
    deskAndroid: "Télécharger sur Google Play",
    deskHint: "Ouvre ce lien sur ton téléphone pour rejoindre le foyer en un geste.",
    invalidTitle: "Invitation introuvable",
    invalidText: "Ce lien est incomplet. Demande à la personne qui t'a invité·e de te renvoyer l'invitation."
  } : {
    title: "You're invited to a WhoDid household 🏠",
    subtitle: "Share the chores, earn points, and finally see who does what.",
    codeLabel: "Invite code",
    copy: "Copy code", copied: "Code copied ✓",
    androidBtn: "Join the household",
    androidHint: "If WhoDid isn't installed yet, Google Play opens: the code will be filled in after you sign up.",
    iosOpen: "I have WhoDid — join the household",
    iosStore: "I don't have WhoDid yet",
    iosStep: "<b>After installing</b>, come back to this page and tap “I have WhoDid”: the code will be filled in for you. Or, in the app: <b>Join a household</b> → paste the code.",
    deskIos: "Download on the App Store",
    deskAndroid: "Get it on Google Play",
    deskHint: "Open this link on your phone to join the household in one tap.",
    invalidTitle: "Invite not found",
    invalidText: "This link is incomplete. Ask the person who invited you to send it again."
  };
  document.documentElement.lang = fr ? "fr" : "en";

  function $(id) { return document.getElementById(id); }
  function show(id) { $(id).classList.remove("hidden"); }

  if (!valid) {
    $("invalidTitle").textContent = t.invalidTitle;
    $("invalidText").textContent = t.invalidText;
    show("invalid");
    return;
  }

  var appUrl = "whodid://join?code=" + code;
  var referrer = "utm_source=whodid_invite&utm_medium=invite_link&invite_code=" + code;
  var playUrl = "https://play.google.com/store/apps/details?id=" + PACKAGE +
    "&referrer=" + encodeURIComponent(referrer);
  var appStoreUrl = APP_STORE_ID
    ? "https://apps.apple.com/app/id" + APP_STORE_ID
    : "itms-apps://search.itunes.apple.com/WebObjects/MZSearch.woa/wa/search?media=software&term=WhoDid";
  var appStoreWebUrl = APP_STORE_ID
    ? "https://apps.apple.com/app/id" + APP_STORE_ID
    : "https://www.apple.com/fr/search/WhoDid?src=globalnav";

  $("title").textContent = t.title;
  $("subtitle").textContent = t.subtitle;
  $("codeLabel").textContent = t.codeLabel;
  $("code").textContent = code;
  $("copyBtn").textContent = t.copy;

  $("copyBtn").addEventListener("click", function () {
    var done = function () { $("copyBtn").textContent = t.copied; };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(code).then(done, function () {});
    } else {
      var area = document.createElement("textarea");
      area.value = code; document.body.appendChild(area); area.select();
      try { document.execCommand("copy"); done(); } catch (e) {}
      document.body.removeChild(area);
    }
  });

  var ua = navigator.userAgent || "";
  var isAndroid = /Android/i.test(ua);
  var isIos = /iPhone|iPad|iPod/i.test(ua) ||
    (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

  if (isAndroid) {
    // Chrome : ouvre WhoDid si installée, sinon Google Play avec le code.
    $("androidBtn").href = "intent://join?code=" + code +
      "#Intent;scheme=whodid;package=" + PACKAGE +
      ";S.browser_fallback_url=" + encodeURIComponent(playUrl) + ";end";
    $("androidBtn").textContent = t.androidBtn;
    $("androidHint").textContent = t.androidHint;
    show("android");
  } else if (isIos) {
    $("iosOpenBtn").href = appUrl;
    $("iosOpenBtn").textContent = t.iosOpen;
    $("iosStoreBtn").href = appStoreUrl;
    $("iosStoreBtn").textContent = t.iosStore;
    $("iosStep").innerHTML = t.iosStep;
    show("ios");
  } else {
    $("deskIos").href = appStoreWebUrl;
    $("deskIos").textContent = t.deskIos;
    $("deskAndroid").href = "https://play.google.com/store/apps/details?id=" + PACKAGE;
    $("deskAndroid").textContent = t.deskAndroid;
    $("deskHint").textContent = t.deskHint;
    show("desktop");
  }

  show("invite");
})();
</script>
</body>
</html>
